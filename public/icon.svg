<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="terragrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="metallicgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" stroke="url(#metallicgrad)" stroke-width="2.5" fill="#0F172A" />

  <!-- Inner Concentric Precision Lines -->
  <polygon points="32,12 49,22 49,42 32,52 15,42 15,22" stroke="rgba(20, 184, 166, 0.3)" stroke-width="1.5" stroke-dasharray="3 2" fill="none" />

  <!-- Central Mineral Node / Precision Sorting Geometry -->
  <polygon points="32,18 44,25 44,39 32,46 20,39 20,25" fill="url(#terragrad)" filter="url(#glow)" />
  
  <!-- Optical Sorting Laser Beams -->
  <line x1="32" y1="4" x2="32" y2="18" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" />
  <line x1="8" y1="46" x2="20" y2="39" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" />
  <line x1="56" y1="46" x2="44" y2="39" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" />

  <!-- Center Core Atom Dot -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
</svg>
